name: Android Debug Build

on:
  workflow_dispatch:
  push:
    paths:
      - "7_farm_visit/apps/web/**"
      - "7_farm_visit/packages/**"
      - "7_farm_visit/package.json"
      - "7_farm_visit/package-lock.json"
      - "7_farm_visit/apps/web/android/**"
  pull_request:
    paths:
      - "7_farm_visit/apps/web/**"
      - "7_farm_visit/packages/**"
      - "7_farm_visit/package.json"
      - "7_farm_visit/package-lock.json"
      - "7_farm_visit/apps/web/android/**"

defaults:
  run:
    shell: bash
    working-directory: 7_farm_visit

env:
  DEFAULT_VITE_API_URL: https://api.example.com/chat

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 7_farm_visit/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build shared workspace package
        run: npm run build:shared

      - name: Build web bundle for Android (Capacitor)
        env:
          PROD_API_URL: ${{ secrets.PROD_API_URL }}
        run: |
          export VITE_API_URL="${PROD_API_URL:-$DEFAULT_VITE_API_URL}"
          npm run build:android --workspace=apps/web

      - name: Sync Capacitor Android project
        run: |
          cd apps/web
          npx cap sync android

      - name: Build Android debug APK
        run: |
          cd apps/web/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: farm-visit-android-debug
          path: apps/web/android/app/build/outputs/apk/debug/*.apk

