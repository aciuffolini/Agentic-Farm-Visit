name: Android Debug Build

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "apps/web/android/**"
    branches:
      - main
      - develop
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "apps/web/android/**"

env:
  DEFAULT_VITE_API_URL: https://api.example.com/chat

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Upgrade npm to latest
        run: npm install -g npm@10

      - name: Show Node and npm versions
        run: |
          node --version
          npm --version

      - name: Enable npm workspaces (npm beta)
        run: npm config set workspaces=true

      - name: Install dependencies (root + workspaces)
        run: npm install --legacy-peer-deps

      - name: Build shared workspace package
        run: npm run build:shared

      - name: Build web bundle for Android (Capacitor)
        env:
          PROD_API_URL: ${{ secrets.PROD_API_URL }}
        run: |
          export VITE_API_URL="${PROD_API_URL:-$DEFAULT_VITE_API_URL}"
          npm run build:android --workspace=apps/web

      - name: Sync Capacitor Android project
        run: |
          cd apps/web
          npx cap sync android

      - name: Build Android debug APK
        run: |
          cd apps/web/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: farm-visit-android-debug
          path: apps/web/android/app/build/outputs/apk/debug/*.apk

